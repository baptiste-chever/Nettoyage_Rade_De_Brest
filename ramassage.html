<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zéro Déchets en Rade – Signalement</title>

  <!-- Inter (optionnel) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
  />

  <link rel="stylesheet" href="css/style.css">

</head>

  
<body>

  <main>
    <h1>🧹 Ramassages de déchets prévus</h1>

    <p>
      Consultez les ramassages programmés sur le littoral.
      Survolez un point pour voir les informations.
      Cliquez sur la carte pour créer un nouveau ramassage.
    </p>

    <div id="map"></div>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialisation de la carte (rade de Brest)
    const map = L.map("map").setView([48.3904, -4.4861], 11);

    // Fond de carte OpenStreetMap
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap"
    }).addTo(map);

    // Exemple de ramassages existants
    const ramassages = [
      {
        lieu: "Plage du Moulin Blanc",
        date: "22/01/2026",
        heure: "10:00",
        lat: 48.387,
        lng: -4.418
      },
      {
        lieu: "Plage de Sainte-Anne",
        date: "25/01/2026",
        heure: "14:00",
        lat: 48.356,
        lng: -4.558
      }
    ];

    // Ajout des ramassages sur la carte
    ramassages.forEach(r => {
      const marker = L.marker([r.lat, r.lng]).addTo(map);

      marker.bindPopup(
        "<strong>" + r.lieu + "</strong><br>" +
        "Date : " + r.date + "<br>" +
        "Heure : " + r.heure
      );
    });

    // Création d’un ramassage au clic
    map.on("click", function (e) {
      const lat = e.latlng.lat.toFixed(5);
      const lng = e.latlng.lng.toFixed(5);

      const confirmation = confirm(
        "Créer un ramassage à cet endroit ?\n\nLatitude : " +
        lat + "\nLongitude : " + lng
      );

      if (confirmation) {
        L.marker([lat, lng])
          .addTo(map)
          .bindPopup(
            "<strong>Nouveau ramassage</strong><br>" +
            "À compléter"
          )
          .openPopup();
      }
    });
  </script>

</body>
</html>
