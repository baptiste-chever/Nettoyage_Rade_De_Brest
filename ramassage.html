<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zéro Déchets en Rade – Collecte</title>

  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    #map {
      height: 500px;
      width: 100%;
      margin-top: 1rem;
    }
  </style>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <div class="nav">
      <a class="brand" href="index.html">Zéro Déchets en Rade</a>
      <nav class="nav-links" aria-label="Navigation principale">
        <a href="index.html">Accueil</a>
        <a class="active" href="ramassage.html">Collecte</a>
        <a href="signalement.html">Signalement</a>
      </nav>
    </div>

    <h1>Ramassages de déchets prévus</h1>
    <p>Consultez les ramassages programmés sur le littoral. Survolez un point pour voir les informations. Cliquez sur la carte pour créer un nouveau ramassage.</p>

  </header>

  
  <main>
    <div id="map" aria-label="Carte des ramassages"></div>
  </main>

  <footer style="text-align:center; padding:1rem; background:#f5f5f5; margin-top:2rem;">
    <p>© Zéro Déchets en Rade — Projet étudiant (ISEN) · Ramassages</p>
  </footer>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    // ----------------------------
    // Carte Leaflet
    // ----------------------------
    const map = L.map("map").setView([48.3904, -4.4861], 11); // Rade de Brest

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap",
      maxZoom: 19
    }).addTo(map);

    // Ramassages existants
    const ramassages = [
      { lieu: "Plage du Moulin Blanc", date: "22/01/2026", heure: "10:00", lat: 48.387, lng: -4.418 },
      { lieu: "Plage de Sainte-Anne", date: "25/01/2026", heure: "14:00", lat: 48.356, lng: -4.558 }
    ];

    ramassages.forEach(r => {
      const marker = L.marker([r.lat, r.lng]).addTo(map);
      marker.bindPopup(`<strong>${r.lieu}</strong><br>Date : ${r.date}<br>Heure : ${r.heure}`);
    });

    // Ajouter un ramassage au clic
    map.on("click", (e) => {
      const lat = e.latlng.lat.toFixed(5);
      const lng = e.latlng.lng.toFixed(5);
    
      const confirmAdd = confirm(`Créer un ramassage à cet endroit ?\n\nLatitude : ${lat}\nLongitude : ${lng}`);
      if (confirmAdd) {
        // Redirige vers la page de création en passant lat/lng en query params
        window.location.href = `creer-ramassage.html?lat=${lat}&lng=${lng}`;
      }
    });
  </script>
</body>
</html>
