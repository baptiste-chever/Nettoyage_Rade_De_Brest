<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ramassages de déchets</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    #map {
      height: 500px;
      width: 100%;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <main>
    <h1>🧹 Ramassages de déchets prévus</h1>

    <p>
      Consultez les ramassages programmés sur le littoral.
      Survolez un point pour voir les informations.
      Cliquez sur la carte pour créer un nouveau ramassage.
    </p>

    <div id="map"></div>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialisation de la carte (rade de Brest)
    const map = L.map("map").setView([48.3904, -4.4861], 11);

    // Fond de carte OpenStreetMap
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap"
    }).addTo(map);

    // Exemple de ramassages existants
    const ramassages = [
      {
        lieu: "Plage du Moulin Blanc",
        date: "22/01/2026",
        heure: "10:00",
        lat: 48.387,
        lng: -4.418
      },
      {
        lieu: "Plage de Sainte-Anne",
        date: "25/01/2026",
        heure: "14:00",
        lat: 48.356,
        lng: -4.558
      }
    ];

    // Ajout des ramassages sur la carte
    ramassages.forEach(r => {
      const marker = L.marker([r.lat, r.lng]).addTo(map);

      marker.bindPopup(
        "<strong>" + r.lieu + "</strong><br>" +
        "Date : " + r.date + "<br>" +
        "Heure : " + r.heure
      );
    });

    // Création d’un ramassage au clic
    map.on("click", function (e) {
      const lat = e.latlng.lat.toFixed(5);
      const lng = e.latlng.lng.toFixed(5);

      const confirmation = confirm(
        "Créer un ramassage à cet endroit ?\n\nLatitude : " +
        lat + "\nLongitude : " + lng
      );

      if (confirmation) {
        L.marker([lat, lng])
          .addTo(map)
          .bindPopup(
            "<strong>Nouveau ramassage</strong><br>" +
            "À compléter"
          )
          .openPopup();
      }
    });
  </script>

</body>
</html>
