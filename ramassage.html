<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zéro Déchets en Rade – Collecte</title>

  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="css/style.css">
  <style>
    main { padding:1rem 2rem; }
    

    #map-container {
      display: flex;
      gap: 1rem;
    }

    #map {
      height: 500px;
      flex: 2;
      border: 1px solid #ccc;
    }

    #info-section {
      flex: 1;
      max-width: 400px;
    }

    .card {
      background:#f5f5f5;
      padding:1rem;
      border-radius:5px;
    }

    .photo-preview img {
      width:100%;
      border-radius:5px;
      object-fit:cover;
      max-height:350px;
    }

    form {
      display:flex;
      flex-direction:column;
      gap:1rem;
      margin-top:1rem;
    }

    label {
      display:flex;
      flex-direction:column;
      font-weight:600;
    }

    input {
      padding:0.5rem;
      margin-top:0.3rem;
      font-size:1rem;
    }

    button {
      padding:0.6rem;
      background:#007BFF;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
      font-size:1rem;
    }

    .inscrits {
      font-size:0.9rem;
      color:#555;
      margin-top:0.5rem;
    }
  </style>
</head>

<body>
  <header>
    <div class="nav">
      <a class="brand" href="index.html">Zéro Déchets en Rade</a>
      <nav class="nav-links" aria-label="Navigation principale">
        <a href="index.html">Accueil</a>
        <a class="active" href="ramassage.html">Collecte</a>
        <a href="signalement.html">Signalement</a>
      </nav>
    </div>
    <h1>Ramassages de déchets prévus</h1>
    
  </header>


  <main>
  <p>Consultez les ramassages programmés sur le littoral. Cliquez sur un point pour voir les informations. Cliquez sur la carte pour créer un nouveau ramassage.</p>
  <br>
  <div id="map-container">
    <div id="map"></div>

    <div id="info-section">
      <div class="photo-preview">
        <img src="figures/equipe_soudee.png" alt="Déchets sur la plage">
      </div>
    </div>
  </div>
</main>
  
<footer>
  <p>© Zéro Déchets en Rade — Projet étudiant (ISEN)</p>
</footer>


<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const map = L.map("map").setView([48.3904, -4.4861], 11);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap"
  }).addTo(map);

  const infoSection = document.getElementById("info-section");
  let tempMarker = null;

  function showPhoto() {
    infoSection.innerHTML = `
      <div class="photo-preview">
        <img src="figures/equipe_soudee.png" alt="Déchets sur la plage">
      </div>
    `;
  }

  function inscritsText(r) {
    return r.inscrits.length
      ? `${r.inscrits.length} inscrit(s)`
      : "Aucun inscrit";
  }

  const ramassages = [
    { lieu:"Plage du Moulin Blanc", date:"22/01/2026", heure:"10:00", lat:48.387, lng:-4.418, inscrits:[] },
    { lieu:"Plage de Sainte-Anne", date:"25/01/2026", heure:"14:00", lat:48.356, lng:-4.558, inscrits:[] }
  ];

  ramassages.forEach(r => {
    const marker = L.marker([r.lat, r.lng]).addTo(map);
    marker.bindPopup(
      `<strong>${r.lieu}</strong><br>Date : ${r.date}<br>Heure : ${r.heure}<br>${inscritsText(r)}`
    );

    marker.on("click", () => {
      if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }

      infoSection.innerHTML = `
        <div class="card">
          <h3>${r.lieu}</h3>
          <p><strong>Date :</strong> ${r.date}</p>
          <p><strong>Heure :</strong> ${r.heure}</p>
          <p class="inscrits">${inscritsText(r)}</p>

          <form id="inscription-form">
            <label>Votre nom
              <input type="text" id="nom" required>
            </label>
            <button>S'inscrire</button>
          </form>
        </div>
      `;

      document.getElementById("inscription-form").addEventListener("submit", e => {
        e.preventDefault();
        r.inscrits.push(document.getElementById("nom").value);
        alert("Merci ! Votre inscription est validée !");
        marker.setPopupContent(
          `<strong>${r.lieu}</strong><br>Date : ${r.date}<br>Heure : ${r.heure}<br>${inscritsText(r)}`
        );
        marker.fire("click");
      });
    });
  });

  map.on("click", e => {
    if (tempMarker) map.removeLayer(tempMarker);

    const lat = e.latlng.lat;
    const lng = e.latlng.lng;

    tempMarker = L.marker([lat, lng], {
      icon: L.icon({
        iconUrl:"https://maps.google.com/mapfiles/ms/icons/red-dot.png",
        iconSize:[32,32],
        iconAnchor:[16,32]
      })
    }).addTo(map);

    infoSection.innerHTML = `
      <div class="card">
        <h3>Créer un ramassage</h3>
        <form id="new-form">
          <label>Nom du lieu
            <input type="text" id="lieu" required>
          </label>
          <label>Date
            <input type="date" id="date" required>
          </label>
          <label>Heure
            <input type="time" id="heure" required>
          </label>
          <button>Créer</button>
        </form>
      </div>
    `;

    document.getElementById("new-form").addEventListener("submit", e => {
      e.preventDefault();

      const lieu = document.getElementById("lieu").value;
      const date = document.getElementById("date").value;
      const heure = document.getElementById("heure").value;

      ramassages.push({ lieu, date, heure, lat, lng, inscrits:[] });

      L.marker([lat, lng]).addTo(map)
        .bindPopup(`<strong>${lieu}</strong><br>Date : ${date}<br>Heure : ${heure}<br>Aucun inscrit`);

      alert("Ramassage créé !");
      map.removeLayer(tempMarker);
      tempMarker = null;
      showPhoto();
    });
  });
</script>

</body>
</html>
