<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zéro Déchets en Rade – Collecte</title>

  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { font-family:'Inter', Arial, sans-serif; margin:0; padding:0; }
    
    main { padding:1rem 2rem; }

    /* Conteneur flex pour carte + infos */
    #map-container {
      display: flex;
      flex-direction: row;
      gap: 1rem;
    }

    #map {
      height: 500px;
      flex: 2;
      border: 1px solid #ccc;
    }

    #info-section {
      flex: 1;
      max-width: 400px;
    }

    .card { background:#f5f5f5; padding:1rem; border-radius:5px; margin-bottom:1rem; }
    form { display:flex; flex-direction:column; gap:1rem; }
    label { display:flex; flex-direction:column; margin-bottom:0.5rem; }
    input, button { padding:0.5rem; font-size:1rem; }
    button { background:#007BFF; color:white; border:none; cursor:pointer; border-radius:5px; }
    .photo-preview img { width:100%; max-height:200px; object-fit:cover; border-radius:5px; }
    .inscrits { margin-top:0.5rem; font-size:0.9rem; color:#555; }
  </style>
</head>

<body>
  <header>
    <div class="nav">
      <a class="brand" href="index.html">Zéro Déchets en Rade</a>
      <nav class="nav-links" aria-label="Navigation principale">
        <a href="index.html">Accueil</a>
        <a class="active" href="ramassage.html">Collecte</a>
        <a href="signalement.html">Signalement</a>
      </nav>
    </div>
    <h1>Ramassages de déchets prévus</h1>
    <p>Consultez les ramassages programmés sur le littoral. Survolez un point pour voir les informations. Cliquez sur la carte pour créer un nouveau ramassage.</p>
  </header>

  <main>
    <div id="map-container">
      <div id="map" aria-label="Carte des ramassages"></div>
      <div id="info-section"></div>
    </div>
  </main>

  <footer>
    <p>© Zéro Déchets en Rade — Projet étudiant (ISEN)</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([48.3904, -4.4861], 11);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap",
      maxZoom: 19
    }).addTo(map);

    const infoSection = document.getElementById('info-section');
    let tempMarker = null;

    // Ramassages existants avec liste d'inscrits
    const ramassages = [
      { lieu: "Plage du Moulin Blanc", date: "22/01/2026", heure: "10:00", lat: 48.387, lng: -4.418, inscrits: [] },
      { lieu: "Plage de Sainte-Anne", date: "25/01/2026", heure: "14:00", lat: 48.356, lng: -4.558, inscrits: [] }
    ];

    // Fonction pour afficher le nombre d'inscrits
    function inscritsText(r) {
      return r.inscrits.length ? `${r.inscrits.length} inscrit(s)` : `Aucun inscrit`;
    }

    // Création des markers existants
    ramassages.forEach(r => {
      const marker = L.marker([r.lat, r.lng]).addTo(map);
      marker.bindPopup(`<strong>${r.lieu}</strong><br>Date : ${r.date}<br>Heure : ${r.heure}<br>${inscritsText(r)}`);

      marker.on('click', () => {
        if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }

        infoSection.innerHTML = `
          <div class="card">
            <h3>${r.lieu}</h3>
            <p><strong>Date :</strong> ${r.date}</p>
            <p><strong>Heure :</strong> ${r.heure}</p>
            <p class="inscrits"><strong>Inscriptions :</strong> ${inscritsText(r)}</p>
            <form id="inscription-form">
              <label>Votre nom<input type="text" id="nom-inscrit" required /></label>
              <button type="submit">S'inscrire au ramassage</button>
            </form>
          </div>
        `;
        const form = document.getElementById('inscription-form');
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const nom = document.getElementById('nom-inscrit').value.trim();
          if (!nom) return alert("Veuillez entrer votre nom");
          r.inscrits.push(nom);
          alert("Merci ! Votre inscription est validée !");
          // Mettre à jour la popup du marker
          marker.setPopupContent(`<strong>${r.lieu}</strong><br>Date : ${r.date}<br>Heure : ${r.heure}<br>${inscritsText(r)}`);
          // Réaffiche les infos avec nombre d'inscrits mis à jour
          marker.fire('click');
        });
      });
    });

    // Clique sur la carte pour créer un nouveau ramassage
    map.on('click', (e) => {
      const lat = e.latlng.lat.toFixed(5);
      const lng = e.latlng.lng.toFixed(5);

      const existing = ramassages.find(r => Math.abs(r.lat - lat) < 0.0001 && Math.abs(r.lng - lng) < 0.0001);
      if (existing) return;

      if (tempMarker) map.removeLayer(tempMarker);

      // Marker rouge temporaire
      tempMarker = L.marker([lat, lng], {
        icon: L.icon({
          iconUrl: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png',
          iconSize: [32,32],
          iconAnchor: [16,32]
        })
      }).addTo(map);

      infoSection.innerHTML = `
          <div class="photo-preview"> 
          `;

      // Formulaire à droite pour créer ramassage
      infoSection.innerHTML = `
        <div class="card">
          <h3>Créer un nouveau ramassage</h3>
          <form id="new-ramassage-form">
            <label>Nom du lieu<input type="text" id="lieu" required /></label>
            <label>Date<input type="date" id="date" required /></label>
            <label>Heure<input type="time" id="heure" required /></label>
            <button type="submit">Enregistrer le ramassage</button>
          </form>
        </div>
      `;

      const form = document.getElementById('new-ramassage-form');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const lieu = document.getElementById('lieu').value.trim();
        const date = document.getElementById('date').value;
        const heure = document.getElementById('heure').value;

        if (!lieu || !date || !heure) return alert("Veuillez remplir tous les champs");

        // Ajouter le nouveau ramassage
        const marker = L.marker([lat, lng]).addTo(map)
          .bindPopup(`<strong>${lieu}</strong><br>Date : ${date}<br>Heure : ${heure}<br>Aucun inscrit`);
        ramassages.push({ lieu, date, heure, lat, lng, inscrits: [] });

        alert("Nouveau ramassage créé !");
        infoSection.innerHTML = '';
        if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
      });
    });
  </script>
</body>
</html>
